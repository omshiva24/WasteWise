<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" />
    <meta name="description" content="WasteWise - smart waste pickups. Supervisors raise requests, vendors collect, admins track every kilo. Works on Android, iOS and the web." />
    <meta name="author" content="P Om Shiva" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WasteWise" />
    <meta property="og:title" content="WasteWise - smart waste pickups" />
    <meta property="og:description" content="Raise, accept and track waste pickups with live stats and PDF reports." />
    <meta property="og:image" content="icons/og.png" />
    <title>WasteWise</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preload" href="fonts/Inter-Regular.woff" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="fonts/Poppins-Bold.woff" as="font" type="font/woff" crossorigin />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="modulepreload" href="js/main.js" />
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-inner">
        <span class="splash-logo-slot"></span>
        <div class="splash-word">WasteWise</div>
        <div class="splash-tag">Smart waste pickups</div>
        <div class="splash-bar"></div>
      </div>
    </div>
    <div id="app"></div>
    <noscript>WasteWise needs JavaScript to run.</noscript>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
