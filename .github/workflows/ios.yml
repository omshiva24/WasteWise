name: iOS build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build for the iOS Simulator (unsigned)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Create iOS project
        run: npx cap add ios
      - name: App icon and splash screen
        continue-on-error: true
        run: npx capacitor-assets generate --ios --iconBackgroundColor '#064e3b' --splashBackgroundColor '#064e3b'
      - name: Camera and photo usage descriptions
        run: node scripts/native-setup.mjs ios
      - name: Copy web app into the native project
        run: npx cap sync ios
      - name: Build with Xcode
        run: |
          if [ -d ios/App/App.xcworkspace ]; then TARGET="-workspace ios/App/App.xcworkspace"; else TARGET="-project ios/App/App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test -d build/Build/Products/Debug-iphonesimulator/App.app
      - name: Package simulator app
        run: cd build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/WasteWise-iOS-Simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: WasteWise-ios-simulator
          path: WasteWise-iOS-Simulator.zip
