name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit + end-to-end tests
    # Pinned: Playwright 1.56 supports Ubuntu 24.04 (ubuntu-latest is moving to 26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unit tests (lifecycle, roles, location, stats, PDF)
        run: node --test tests/*.test.js
      - name: Syntax check (web app + Cloud Functions)
        run: |
          for f in $(find public/js functions scripts tests -name '*.js' -o -name '*.mjs' | grep -v vendor); do node --check "$f"; done
      - name: Install Playwright and the Firebase emulators
        run: |
          npm install -g playwright@1.56.1 firebase-tools
          npx -y playwright@1.56.1 install --with-deps chromium
      - name: End-to-end tests on the real Firebase emulators (also checks firestore.rules)
        timeout-minutes: 15
        env:
          E2E_BACKEND: emulator
        run: PW_PATH="$(npm root -g)/" firebase emulators:exec --only auth,firestore --project demo-wastewise "node tests/e2e/run.mjs"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: docs/screenshots/
          retention-days: 7
      - name: Publish screenshots to the "e2e-screenshots" pre-release
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd docs/screenshots && ls *.png >/dev/null 2>&1 || exit 0
          gh release view e2e-screenshots --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create e2e-screenshots --repo "$GITHUB_REPOSITORY" --prerelease --title "Latest test screenshots" --notes "Screenshots from the latest end-to-end test run."
          gh release upload e2e-screenshots --repo "$GITHUB_REPOSITORY" --clobber *.png
